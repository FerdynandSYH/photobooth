<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gpbDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="gpbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#gpbDark)" stroke="#3F3F46" stroke-width="2.5"/>

  <!-- Top Flash/Finder Bezel -->
  <rect x="36" y="15" width="28" height="7" rx="3" fill="#52525B"/>
  
  <!-- Golden Flash Bulb Indicator -->
  <circle cx="70" cy="30" r="5" fill="url(#gpbGold)"/>

  <!-- Camera Body Frame -->
  <rect x="18" y="22" width="64" height="54" rx="14" fill="#18181B" stroke="#FAF7F2" stroke-width="4.5"/>

  <!-- Outer Lens Ring -->
  <circle cx="50" cy="50" r="18" fill="#09090B" stroke="#FAF7F2" stroke-width="4.5"/>

  <!-- Inner Lens Core & Aperture -->
  <circle cx="50" cy="50" r="10" fill="url(#gpbGold)"/>
  <circle cx="46" cy="46" r="3.2" fill="#FFFFFF" opacity="0.95"/>

  <!-- Bottom 3-Frame Photobooth Strip Dots -->
  <circle cx="36" cy="85" r="2.5" fill="#71717A"/>
  <circle cx="50" cy="85" r="2.8" fill="url(#gpbGold)"/>
  <circle cx="64" cy="85" r="2.5" fill="#71717A"/>
</svg>
